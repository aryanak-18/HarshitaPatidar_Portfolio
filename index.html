<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1422" />
    <script>
      // Dark by default; honour a saved choice before first paint to avoid a flash.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.remove('dark')
          document.querySelector('meta[name="theme-color"]').content = '#FAFAF7'
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Harshita Patidar — product & growth in fintech. Founder's Office at Nubra, focused on activation, retention and product analytics." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
    <title>Harshita Patidar | Product & Growth</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
